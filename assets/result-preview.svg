<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative MySRCore Hall of Fame and Pareto frontier</title>
  <desc id="desc">A synthetic Julia backend result view with expression trees, loss, complexity, and Pareto candidates.</desc>
