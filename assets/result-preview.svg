  <text x="210" y="247" fill="#687384" font-family="DejaVu Sans Mono, monospace" font-size="16">0.31</text>
  <text x="310" y="247" fill="#12161C" font-family="DejaVu Sans Mono, monospace" font-size="16">add(square(x0), ...)</text>
  <text x="86" y="299" fill="#12161C" font-family="DejaVu Sans Mono, monospace" font-size="16">7</text>
