  <text x="310" y="147" fill="#1947D1" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700">STRING TREE</text>
  <rect x="52" y="162" width="585" height="52" fill="#FFFFFF"/>
  <rect x="52" y="214" width="585" height="52" fill="#F8FAFC"/>
  <rect x="52" y="266" width="585" height="52" fill="#FFFFFF"/>
